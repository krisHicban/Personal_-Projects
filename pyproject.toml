[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inventory-tracker"
version = "0.1.0"
description = "A local inventory tracker for resale-platform listings"
requires-python = ">=3.10"

[project.scripts]
inventory = "inventory_tracker.cli:main"

[tool.setuptools.packages.find]
include = ["inventory_tracker*"]

